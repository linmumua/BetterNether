# 本机工作区路径含中文（更好的地狱）。Gradle 用 daemon 的 file.encoding 写 test worker 的
# @argfile，而 JDK 启动器按系统 ANSI 代码页展开该 argfile；两者不一致会把非 ASCII 的
# classpath 条目写坏（表现为该目录下测试类「Could not execute test class」）。
# 因此 daemon 写出与启动器读取都统一为 GBK；源码编码仍由 options.encoding=UTF-8 /
# filteringCharset=UTF-8 保证，二者互不影响。
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=GBK
systemProp.file.encoding=GBK

# 制品坐标与版本（输出 jars/BetterNether-<version>.jar）。
# 0.1.0-folia26.3：首个可用版本，目标是「BetterNether 的地形、23 个下界群系、矿物、
# 1x1 方块与植被 + Nether City 结构」在 Paper/Folia 26.3 上跑通，全部方块由 CraftEngine 提供。
pluginGroup=dev.mumu.betternether
pluginVersion=0.1.0-folia26.3

# 依赖的实际 jar（仅 compileOnly，绝不打包）
#   mucore-api 为 MU核心 / Folia 26.3 的 API 与 Paper/Bukkit API（org.bukkit.*、io.papermc.*）。
#   craft-engine-paper-plugin 已内嵌 craft-engine-core / craft-engine-bukkit 与迁移后的库。
#   serverJar 是服务端本体（未混淆的 net.minecraft.*），只为编译期访问 NMS 的一个调用：
#   ChunkGenerator#getBaseColumn —— 巨型熔岩湖的水位必须读原版 base noise column，
#   Bukkit/Paper 没有等价 API（LimitedRegion 只有 16 格缓冲，WorldInfo 完全没有地形查询）。
#   dataFixerUpperJar 是访问 serverJar 时的必需补丁：serverJar 只内嵌了 DFU 的一小部分
#   （Either/DataFixerBuilder…），而 ServerLevel 等类的签名引用了 com.mojang.datafixers.util.Pair，
#   缺它 javac 会在读取类文件时直接失败。取服务端自己的 libraries 版本，零下载。
mucoreApiJar=C:/PluginLibs/mucore-api-26.3.local-SNAPSHOT.jar
craftEngineJar=C:/PluginLibs/craft-engine-paper-plugin-26.10-SNAPSHOT.jar
serverJar=E:/\u6211\u7684\u4e16\u754c\u63d2\u4ef6/folia\u6d4b\u8bd5\u7aef/versions/26.3/mucore-26.3.jar
dataFixerUpperJar=E:/\u6211\u7684\u4e16\u754c\u63d2\u4ef6/folia\u6d4b\u8bd5\u7aef/libraries/com/mojang/datafixerupper/10.0.21/datafixerupper-10.0.21.jar

# 原版 NoiseBasedChunkGenerator 签名依赖，复用服务端现有库，仅供编译。
commonsLangJar=E:/\u6211\u7684\u4e16\u754c\u63d2\u4ef6/folia\u6d4b\u8bd5\u7aef/libraries/org/apache/commons/commons-lang3/3.20.0/commons-lang3-3.20.0.jar

# SnakeYAML：随产物打包并重定位（见 plugin/build.gradle.kts 的 shadowJar）。
snakeyamlVersion=2.2

# 上游 BetterNether 源码目录（只读）与 Python 解释器。
bnUpstreamDir=upstream/BetterNether
pythonExecutable=python
