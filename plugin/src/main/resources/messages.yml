# BetterNether 文本消息（简体中文，MiniMessage 格式）。
#
# 所有以人类可读形式输出的文字都集中在这里：控制台行，以及游戏内命令的回复。
# 值使用 MiniMessage 语法（<red>、<gradient:...>、<bold> 等），由服务端渲染。
#
# 与 config.yml 同一套升级规则：这里也带 config-version；插件更新新增的键会以默认值补上，
# 你改过的值不会被覆盖，改动前旧文件会备份为 messages.yml.bak。
#
# 注意：MiniMessage 的标签名不能重复嵌套自定义前缀，所以每条消息都写全前缀。
config-version: 2

# ------------------------------------------------------------------------------
# 插件生命周期
# ------------------------------------------------------------------------------
plugin:
  # 启用成功时打印到控制台（方块与群系已就绪）。
  enabled: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <green>已启用</green><gray>：</gray><white>下界地形、群系与矿物生成已就绪。</white>"
  # 停用时打印到控制台。
  disabled: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <gray>已停用；已取消后台任务，未落的文件写入不会被回滚。</gray>"

# ------------------------------------------------------------------------------
# 资源包释放状态消息（installPack 方法）
# ------------------------------------------------------------------------------
pack:
  # 首次安装：写入 <released> 个文件。<occasion> 为时机（启动/重载），<pack> 为包名。
  first-install: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <gray>[<occasion>] 已释放 CraftEngine 资源包 </gray><white><pack></white><gray>：</gray><yellow><released></yellow><gray> 个文件（首次安装）。</gray>"
  # 补齐缺失文件：新增 <released>，已存在 <skipped>。
  completed: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <gray>[<occasion>] CraftEngine 资源包 </gray><white><pack></white><gray> 已补齐缺失文件：</gray><yellow><released></yellow><gray> 个新增，</gray><yellow><skipped></yellow><gray> 个已存在。</gray>"
  # 完整，无需写入：<skipped> 个文件均已存在。
  unchanged: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <gray>[<occasion>] CraftEngine 资源包 </gray><white><pack></white><gray> 完整，</gray><yellow><skipped></yellow><gray> 个文件均已存在。</gray>"
  # 未写入任何文件（异常情况）。
  no-files: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <yellow>[<occasion>] CraftEngine 资源包 </yellow><white><pack></white><yellow> 未写入任何文件。</yellow>"

# ------------------------------------------------------------------------------
# CraftEngine 就绪检查与监听注册
# ------------------------------------------------------------------------------
listeners:
  # CraftEngine 未就绪，跳过「失去支撑的植物掉落」监听。
  breakdown-skipped: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <yellow>CraftEngine 未就绪，跳过「失去支撑的植物掉落」监听：破坏后不会掉落。修正 CE 并重启服务器后该功能才会生效。</yellow>"
  # 已注册「失去支撑的植物掉落」监听：<count> 个方块。
  breakdown-registered: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <green>已注册「失去支撑的植物掉落」监听</green><gray>：</gray><yellow><count></yellow><gray> 个方块失去支撑时由本插件掉落。</gray>"
  # CraftEngine 未就绪，跳过「放置后重算方块形态」监听。
  shape-skipped: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <yellow>CraftEngine 未就绪，跳过「放置后重算方块形态」监听：手动放置的藤/树干不会自动分段。修正 CE 并重启服务器后该功能才会生效。</yellow>"
  # 已注册「放置后重算方块形态」监听：<count> 个方块。
  shape-registered: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <green>已注册「放置后重算方块形态」监听</green><gray>：</gray><yellow><count></yellow><gray> 个方块放置后自动分段。</gray>"
  # CraftEngine 未就绪，跳过「悬挂藤蔓生长」监听。
  vine-growth-skipped: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <yellow>CraftEngine 未就绪，跳过「悬挂藤蔓生长」周期任务：藤蔓不会自动向下延伸。修正 CE 并重启服务器后该功能才会生效。</yellow>"
  # 已注册「悬挂藤蔓生长」周期任务：周期 <period> tick。
  vine-growth-registered: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <green>已注册「悬挂藤蔓向下延伸」监听</green><gray>：</gray><white><status></white><gray>；蹲下空手右键藤蔓可续放一株。</gray>"
  # 藤蔓自然生长已启动的详细状态（替换 <status> 占位符）。
  vine-growth-started: "自然生长已启动（周期 <interval> tick，每轮 <attempts> 次、几率 <chance>%），最大长度 <max-length>"
  # 藤蔓自然生长未启动的原因（替换 <status> 占位符）。
  vine-growth-idle: "自然生长未启动（vine.growth-attempts 或 vine.growth-chance 为 0）"

# ------------------------------------------------------------------------------
# 世界生成器就绪状态
# ------------------------------------------------------------------------------
generator:
  # CraftEngine 未就绪导致无法接管世界生成时的错误消息（<refusal> 为拒绝原因）。
  refused: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <red><refusal></red>"
  # 上一行之后紧接着打印的提示：插件保持启用，但不会接管世界生成。
  refused-hint: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <yellow>插件保持启用，但不会接管世界生成。</yellow><white>/betternether reload</white><yellow> 会尝试释放资源包并重新检查；若仍不就绪，请确认 CraftEngine 已加载 betternether 包（</yellow><white>/ce reload</white><yellow> 后查看日志）。</yellow>"
  # 生成器已就绪时打印的成功消息：<biomes> 个群系已就绪。
  ready: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <green>BetterNether：</green><yellow><biomes></yellow><gray> 个下界群系已就绪，用 </gray><white>generator=BetterNether:betternether</white><gray> 创建 NETHER 世界。</gray>"

# ------------------------------------------------------------------------------
# 启动期拒绝启用 / 无法生成世界的原因。这些是运营者必须读懂的话，
# 所以不使用迷惑性措辞：插件停用并不会阻止服务端生成世界，
# Paper/Folia 会为指名 BetterNether 的世界回退原版生成器，把原版地形写进区域文件。
# ------------------------------------------------------------------------------
config:
  # config.yml 无法读取或取值不可用：插件不会启用。
  invalid: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <red>config.yml 无效，BetterNether 不可用；Paper/Folia 可能回退原版生成器，请停止服务器并修正 config.yml 后再生成世界（原文件保持不动）。</red>"

craftengine:
  # 找不到 / 未启用 CraftEngine 插件时。
  missing: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <red>CraftEngine 是必需前置，但未找到或未启用；BetterNether 不可用，Paper/Folia 可能回退原版生成器，请停止服务器并修正后再生成世界。</red>"
  # CraftEngine 已启用，但世界生成必需的方块仍未注册时（<missing> 为缺失项列表）。
  not-ready: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <red>CraftEngine 尚未注册世界生成必需的方块（<missing>）；这通常意味着资源包未加载，或 CraftEngine 的 misc.delay-configuration-load 仍为 true。BetterNether 不可用，请停止服务器并修正后再生成世界。</red>"
  # 上一行之后紧接着打印的修复指引：CE 的 betternether 资源包必须在启动前就位，容量变更只能靠完整重启消化。
  not-ready-hint: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <yellow>修复指引：CraftEngine 的 betternether 资源包必须在启动前就位（</yellow><white>plugins/CraftEngine/resources/betternether/</white><yellow>），并把 CraftEngine 的 </yellow><white>misc.delay-configuration-load</white><yellow> 设为 </yellow><white>false</white><yellow> 后完整重启服务器；</yellow><white>/ce reload</white><yellow> 只适合让资源加载生效，方块容量变更必须完整重启。</yellow>"

# ------------------------------------------------------------------------------
# 帮助屏：/betternether 与 /betternether help 渲染完全一致。
# 只有命令行那一行带点击事件，且是 suggest_command：点击只把命令填进输入框，不会直接执行。
# 不要把它改成 run_command —— reload 会读写配置文件，必须由人按下回车。
# ------------------------------------------------------------------------------
help:
  header: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <gray>可用命令</gray><dark_gray>（点击可直接填入输入框）</dark_gray><gray>：</gray>"
  # <command> 为命令本身，点击行为由代码统一绑定。
  row-reload: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <white><command></white> <gray>—— 重新读取 config.yml 与 messages.yml 并逐项报告哪些改动已生效、哪些必须重启世界生成。</gray>"
  row-help: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <white><command></white> <gray>—— 显示本帮助。</gray>"
  footer: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <gray>reload 权限：</gray><white>betternether.command.reload</white><gray>。提醒：</gray><white>读取配置</white><gray> ≠ </gray><white>重载资源包</white><gray> ≠ </gray><white>重新生成地形</white><gray>：资源包请用 CraftEngine 自己的重载命令，地形改动必须重启世界生成。</gray>"

# ------------------------------------------------------------------------------
# /betternether reload 的输出。逐项报告，绝不把「需要重启才生效」说成「已生效」，
# 也绝不把「配置已读取」说成「资源包已重载」或「已生成的区块已更新」。
#
# 占位符：<keys> 为配置键列表，<reason> 为失败原因，<version> 为 config-version 世代号。
# ------------------------------------------------------------------------------
command:
  # 命令在服务端命令列表里的描述。
  description: "BetterNether：重新读取配置与文本，并报告哪些改动需要重启世界生成。"
  reload:
    # 已有一轮 reload 正在执行：不并发、不排队，让后来者稍后重试。
    busy: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <yellow>已有一轮 reload 正在执行，请等它结束后再试；本次未做任何改动。</yellow>"
    # 开始执行时的一行。
    header: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <gray>开始重新读取 config.yml……</gray>"
    # 配置项取值不可用（类型/范围错误）：什么都没生效。
    invalid: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <red>config.yml 校验失败：<reason>。本次未应用任何改动，运行中的取值保持不变。</red>"
    # 读不到 / 写不了文件：什么都没生效。
    io-error: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <red>config.yml 读取失败：<reason>。本次未应用任何改动，运行中的取值保持不变。</red>"
    # reload 意外中止（未预期的异常）。
    failed: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <red>reload 意外中止：<reason>。</red><gray>已完成的部分不会自动撤回，请核对控制台记录后重试。</gray>"
    # config.yml 不存在，已按内置默认重新写出（<version> 为内置文件的 config-version）。
    config-released: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <green>config.yml 不存在，已写出内置默认文件</green><gray>（config-version <version>）。</gray>"
    # 这次补上了缺失的键（<keys> 为键名列表）；你已设置的取值不会被改动。
    keys-added: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <green>已补全缺失的配置键</green><gray>（你已有的取值保持不变）：</gray><white><keys></white>"
    # 没有需要补全的键。
    keys-none: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <gray>没有缺失的配置键；config.yml 已按当前文件校验通过。</gray>"
    # 有 <count> 处取值不可用，已被替换成内置默认值（<keys> 列出具体条目）：
    # 这些是你写了、但**没有按你写的生效**的项，所以本条出现时不会再打印「reload 完成」。
    config-warnings: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <red>config.yml 中有 <count> 处取值不可用，已替换为内置默认值</red><gray>（你写的值没有生效）：</gray><white><keys></white>"
    # messages.yml 也重新读取了，新文案立即生效。
    messages-reloaded: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <green>messages.yml 已重新读取</green><gray>，新文案立即生效。</gray>"
    # messages.yml 读取失败（<reason>）：沿用上一次成功读取的文案，不谎称已重新加载。
    messages-failed: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <red>messages.yml 重新读取失败：<reason>。本次仍沿用上一次成功读取的文案。</red>"
    # 无条件输出的一行：本命令不写资源包、也不触发 CraftEngine 重载。
    ce-pack: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <gray>资源包：本次未执行释放。要重写 </gray><white>plugins/CraftEngine/resources/betternether/</white><gray>，请确认 CraftEngine 已启用。</gray>"
    ce-pack-result: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <gray>资源包：</gray><white><result></white><gray>。文件已就位，但要让改动生效仍需执行 CraftEngine 自己的重载（例如 </gray><white>/ce reload</white><gray>）。</gray>"
    # CraftEngine 当前仍未注册世界生成必需的方块：报告不能宣称资源已就绪。
    ce-not-ready: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <red>CraftEngine 当前仍未注册世界生成必需的方块；此时新建世界可能回退原版生成器。请先用 CraftEngine 的重载命令让资源包生效。</red>"
    # 世界生成参数有变化（<keys>）：已生成的地形不会变，必须重启世界生成。
    restart-required: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <yellow>以下世界生成参数已改变：</yellow><white><keys></white><yellow>。已生成的地形与已存在的世界不会变化</yellow><gray>（新参数只用于此后新建的世界）；要让改动真正体现，请重启服务端并重新生成对应世界的区块。</gray>"
    # 没有任何世界生成参数变化。
    restart-none: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <gray>没有任何世界生成参数变化，本次无需重启世界生成。</gray>"
    # 全部成功时的收尾行。
    success: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <green>reload 完成</green><gray>：config.yml 与 messages.yml 已按上面的报告生效。</gray>"
