# BetterNether 文本消息（简体中文，MiniMessage 格式）。
#
# 所有以人类可读形式输出的文字都集中在这里：控制台行，以及游戏内命令的回复。
# 值使用 MiniMessage 语法（<red>、<gradient:...>、<bold> 等），由服务端渲染。
#
# 与 config.yml 同一套升级规则：这里也带 config-version；插件更新新增的键会以默认值补上，
# 你改过的值不会被覆盖，改动前旧文件会备份为 messages.yml.bak。
#
# 注意：MiniMessage 的标签名不能重复嵌套自定义前缀，所以每条消息都写全前缀。
#
# 3：精简启动日志。以下控制台消息不再带渐变前缀（控制台已有 [BetterNether]）。
#    已有服务器的旧文案不会被覆盖；想换成新文案，删掉 messages.yml 后重启即可。
config-version: 3

# ------------------------------------------------------------------------------
# 插件生命周期（控制台）
# ------------------------------------------------------------------------------
plugin:
  # CraftEngine 就绪、生成器可用时打印。<biomes> 为群系数量。
  enabled: "<green>已启用</green><gray>：<white><biomes></white> 个下界群系，生成器 <white>BetterNether:betternether</white>。</gray>"
  disabled: "<gray>已停用。</gray>"

# ------------------------------------------------------------------------------
# 资源包释放（控制台）。<pack> 包名，<released> 新写入数，<skipped> 已存在数。
# ------------------------------------------------------------------------------
pack:
  first-install: "<gray>资源包 <white><pack></white> 已释放：<white><released></white> 个文件（首次安装）。</gray>"
  completed: "<gray>资源包 <white><pack></white> 已补齐：新增 <white><released></white>，已有 <white><skipped></white>。</gray>"
  unchanged: "<gray>资源包 <white><pack></white> 完整（<white><skipped></white> 个文件）。</gray>"
  no-files: "<yellow>资源包 <white><pack></white> 未写入任何文件。</yellow>"

# ------------------------------------------------------------------------------
# 方块监听（控制台）。CraftEngine 未就绪时不注册，统一由 generator.paused 说明。
# ------------------------------------------------------------------------------
listeners:
  # <count> 为方块种数。
  breakdown-registered: "<gray>植物失去支撑掉落：<white><count></white> 种方块。</gray>"
  shape-registered: "<gray>放置自动分段：<white><count></white> 种方块。</gray>"
  # <status> 取下面两条之一。
  vine-growth-registered: "<gray>悬挂藤蔓：<status>；蹲下空手右键可续放。</gray>"
  vine-growth-started: "每 <interval> tick 生长 <attempts> 次、几率 <chance>%，最长 <max-length>"
  vine-growth-idle: "自然生长关闭（growth-attempts 或 growth-chance 为 0）"

# ------------------------------------------------------------------------------
# 世界生成器（控制台）
# ------------------------------------------------------------------------------
generator:
  # CraftEngine 未就绪时，紧跟在原因与修复提示之后打印。
  paused: "<yellow>已暂停：世界生成、植物掉落、放置分段、藤蔓生长。修复后完整重启服务器即可恢复。</yellow>"

# ------------------------------------------------------------------------------
# 启动期错误。插件停用不会阻止服务端生成世界：Paper/Folia 会回退原版生成器。
# ------------------------------------------------------------------------------
config:
  # config.yml 无法读取或取值不可用：插件不会启用。
  invalid: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <red>config.yml 无效，BetterNether 不可用；Paper/Folia 可能回退原版生成器，请停止服务器并修正 config.yml 后再生成世界（原文件保持不动）。</red>"

craftengine:
  missing: "<red>缺少前置 CraftEngine（未安装或未启用）。</red>"
  # <missing> 为未注册的方块 id 列表。
  not-ready: "<red>CraftEngine 未注册必需方块：<missing>。</red>"
  # 资源包本次刚首次释放：CraftEngine 已先于本插件读完资源，重启一次即可。
  first-install-hint: "<yellow>资源包刚首次释放，CraftEngine 还没加载它；重启服务器一次即可。</yellow>"
  # 资源包早已存在仍未就绪时的修复步骤。
  not-ready-hint: "<yellow>修复：确认 <white>plugins/CraftEngine/resources/betternether/</white> 存在，CraftEngine 的 <white>misc.delay-configuration-load</white> 为 <white>false</white>，然后完整重启。</yellow>"

# ------------------------------------------------------------------------------
# 帮助屏：/betternether 与 /betternether help 渲染完全一致。
# 只有命令行那一行带点击事件，且是 suggest_command：点击只把命令填进输入框，不会直接执行。
# 不要把它改成 run_command —— reload 会读写配置文件，必须由人按下回车。
# ------------------------------------------------------------------------------
help:
  header: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <gray>可用命令</gray><dark_gray>（点击可直接填入输入框）</dark_gray><gray>：</gray>"
  # <command> 为命令本身，点击行为由代码统一绑定。
  row-reload: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <white><command></white> <gray>—— 重新读取 config.yml 与 messages.yml 并逐项报告哪些改动已生效、哪些必须重启世界生成。</gray>"
  row-help: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <white><command></white> <gray>—— 显示本帮助。</gray>"
  footer: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <gray>reload 权限：</gray><white>betternether.command.reload</white><gray>。提醒：</gray><white>读取配置</white><gray> ≠ </gray><white>重载资源包</white><gray> ≠ </gray><white>重新生成地形</white><gray>：资源包请用 CraftEngine 自己的重载命令，地形改动必须重启世界生成。</gray>"

# ------------------------------------------------------------------------------
# /betternether reload 的输出。逐项报告，绝不把「需要重启才生效」说成「已生效」，
# 也绝不把「配置已读取」说成「资源包已重载」或「已生成的区块已更新」。
#
# 占位符：<keys> 为配置键列表，<reason> 为失败原因，<version> 为 config-version 世代号。
# ------------------------------------------------------------------------------
command:
  # 命令在服务端命令列表里的描述。
  description: "BetterNether：重新读取配置与文本，并报告哪些改动需要重启世界生成。"
  reload:
    # 已有一轮 reload 正在执行：不并发、不排队，让后来者稍后重试。
    busy: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <yellow>已有一轮 reload 正在执行，请等它结束后再试；本次未做任何改动。</yellow>"
    # 开始执行时的一行。
    header: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <gray>开始重新读取 config.yml……</gray>"
    # 配置项取值不可用（类型/范围错误）：什么都没生效。
    invalid: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <red>config.yml 校验失败：<reason>。本次未应用任何改动，运行中的取值保持不变。</red>"
    # 读不到 / 写不了文件：什么都没生效。
    io-error: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <red>config.yml 读取失败：<reason>。本次未应用任何改动，运行中的取值保持不变。</red>"
    # reload 意外中止（未预期的异常）。
    failed: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <red>reload 意外中止：<reason>。</red><gray>已完成的部分不会自动撤回，请核对控制台记录后重试。</gray>"
    # config.yml 不存在，已按内置默认重新写出（<version> 为内置文件的 config-version）。
    config-released: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <green>config.yml 不存在，已写出内置默认文件</green><gray>（config-version <version>）。</gray>"
    # 这次补上了缺失的键（<keys> 为键名列表）；你已设置的取值不会被改动。
    keys-added: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <green>已补全缺失的配置键</green><gray>（你已有的取值保持不变）：</gray><white><keys></white>"
    # 没有需要补全的键。
    keys-none: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <gray>没有缺失的配置键；config.yml 已按当前文件校验通过。</gray>"
    # 有 <count> 处取值不可用，已被替换成内置默认值（<keys> 列出具体条目）：
    # 这些是你写了、但**没有按你写的生效**的项，所以本条出现时不会再打印「reload 完成」。
    config-warnings: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <red>config.yml 中有 <count> 处取值不可用，已替换为内置默认值</red><gray>（你写的值没有生效）：</gray><white><keys></white>"
    # messages.yml 也重新读取了，新文案立即生效。
    messages-reloaded: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <green>messages.yml 已重新读取</green><gray>，新文案立即生效。</gray>"
    # messages.yml 读取失败（<reason>）：沿用上一次成功读取的文案，不谎称已重新加载。
    messages-failed: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <red>messages.yml 重新读取失败：<reason>。本次仍沿用上一次成功读取的文案。</red>"
    # 无条件输出的一行：本命令不写资源包、也不触发 CraftEngine 重载。
    ce-pack: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <gray>资源包：本次未执行释放。要重写 </gray><white>plugins/CraftEngine/resources/betternether/</white><gray>，请确认 CraftEngine 已启用。</gray>"
    ce-pack-result: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <gray>资源包：</gray><white><result></white><gray>。文件已就位，但要让改动生效仍需执行 CraftEngine 自己的重载（例如 </gray><white>/ce reload</white><gray>）。</gray>"
    # CraftEngine 当前仍未注册世界生成必需的方块：报告不能宣称资源已就绪。
    ce-not-ready: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <red>CraftEngine 当前仍未注册世界生成必需的方块；此时新建世界可能回退原版生成器。请先用 CraftEngine 的重载命令让资源包生效。</red>"
    # 世界生成参数有变化（<keys>）：已生成的地形不会变，必须重启世界生成。
    restart-required: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <yellow>以下世界生成参数已改变：</yellow><white><keys></white><yellow>。已生成的地形与已存在的世界不会变化</yellow><gray>（新参数只用于此后新建的世界）；要让改动真正体现，请重启服务端并重新生成对应世界的区块。</gray>"
    # 没有任何世界生成参数变化。
    restart-none: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <gray>没有任何世界生成参数变化，本次无需重启世界生成。</gray>"
    # 全部成功时的收尾行。
    success: "<gradient:#7cf0ff:#8a7cff><bold>BetterNether</bold></gradient> <dark_gray>»</dark_gray> <green>reload 完成</green><gray>：config.yml 与 messages.yml 已按上面的报告生效。</gray>"
